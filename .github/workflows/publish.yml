name: Publish

on:
    release:
        types: [published]

permissions:
    contents: read
    id-token: write
    packages: write

jobs:
    publish:
        name: Publish
        uses: RustForWeb/.github/.github/workflows/publish.yml@b5ef6f755ec1f34502bf3e355f984f1e2815a33c # v1.0.5
        with:
            enable-rust: true
            enable-typescript: false
