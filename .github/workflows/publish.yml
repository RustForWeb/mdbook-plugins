name: Publish

on:
    release:
        types: [published]

permissions:
    contents: read
    id-token: write
    packages: write

jobs:
    publish:
        name: Publish
        uses: RustForWeb/.github/.github/workflows/publish.yml@1eb0d276693a31a20809731314b00c52c9bcba32 # v1.0.6
        with:
            enable-rust: true
            enable-typescript: false
