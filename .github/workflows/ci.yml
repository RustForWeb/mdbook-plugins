name: CI

on:
    pull_request: {}
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    commits:
        name: Commits
        uses: RustForWeb/.github/.github/workflows/commits.yml@b5ef6f755ec1f34502bf3e355f984f1e2815a33c # v1.0.5

    rust:
        name: Rust
        uses: RustForWeb/.github/.github/workflows/rust.yml@b5ef6f755ec1f34502bf3e355f984f1e2815a33c # v1.0.5
        with:
            target: wasm32-unknown-unknown
