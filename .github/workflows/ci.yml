name: CI

on:
    pull_request: {}
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    commits:
        name: Commits
        uses: RustForWeb/.github/.github/workflows/commits.yml@1eb0d276693a31a20809731314b00c52c9bcba32 # v1.0.6

    rust:
        name: Rust
        uses: RustForWeb/.github/.github/workflows/rust.yml@1eb0d276693a31a20809731314b00c52c9bcba32 # v1.0.6
        with:
            target: wasm32-unknown-unknown
