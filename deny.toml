[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "No maintained version available for `paste`." },
    { id = "RUSTSEC-2026-0173", reason = "No maintained version available for `proc-macro-error2`." },
    { id = "RUSTSEC-2026-0183", reason = "No safe version available for `git2` due to other dependencies." },
    { id = "RUSTSEC-2026-0184", reason = "No safe version available for `git2` due to other dependencies." },
    { id = "RUSTSEC-2026-0247", reason = "No maintained version available for `bitmaps`." },
    { id = "RUSTSEC-2026-0250", reason = "No maintained version available for `im-rc`." },
    { id = "RUSTSEC-2026-0251", reason = "No maintained version available for `sized-chunks`." },
    { id = "RUSTSEC-2026-0255", reason = "No safe version available for `sized-chunks` due to other dependencies." },
]
yanked = "deny"

[bans]
allow-wildcard-paths = true
multiple-versions = "allow"
wildcards = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC-BY-4.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 1.0

[sources]
unknown-git = "deny"
unknown-registry = "deny"
